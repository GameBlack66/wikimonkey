<style>  * { margin: 0; padding: 0; } 
    body {
  background: linear-gradient(-45deg, #ff8c00, #e73c3c, #2364d5, #ffffff, #1a1a1a, #2ecc40, #f5d800);
  background-size: 300% 300%;
  animation: gradient 20s ease infinite;
}

@keyframes gradient {
  0%   { background-position: 1% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}      .card {
      width: 120px;
      height: 80px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover { transform: scale(1.05); }
    .card iframe { width: 100%; height: 100%; border: none; pointer-events: none; }
    .card .overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0); transition: background 0.3s;
    }
    .card:hover .overlay { background: rgba(0,0,0,0.1); }
    .card .label {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.7); color: #fff; text-align: center;
      padding: 3px; font-family: sans-serif; font-size: 9px;
    }
    #controls {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 12px; z-index: 10;
    }
    #controls button {
      padding: 8px 16px; font-size: 14px; border: none; border-radius: 6px;
      background: rgba(255,255,255,0.15); color: #fff; cursor: pointer;
      backdrop-filter: blur(10px);
    }
    #controls button:hover { background: rgba(255,255,255,0.3); } </style>
<body> <div id="container"></div>
  <div id="controls">
    <button onclick="rotateLeft()">←</button>
    <button onclick="rotateRight()">→</button>
  </div>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

    const pages = [
      { url: 'texte.html',   link: 'texte.html',   label: 'Explication' },
      { url: 'armand.html',  link: 'armand.html',  label: 'Armand page' },
      { url: 'lukas.html',   link: 'lukas.html',   label: 'Lukas page' },
      { url: 'oulann.html',  link: 'oulann.html',  label: 'Oulann page ' },
      { url: 'gael.html',    link: 'gael.html',    label: 'Gael page' },
      { url: 'noel.html', link: 'noel.html', label: 'Noel page' },
    ];

    const container = document.getElementById('container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 5000);
    camera.position.z = 190;

    const renderer = new CSS3DRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const group = new THREE.Group();
    scene.add(group);

    const radius = 200;
    const angleStep = (Math.PI * 2) / pages.length;

    pages.forEach((page, i) => {
      const angle = i * angleStep;
      const x = Math.sin(angle) * radius;
      const z = Math.cos(angle) * radius;

      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <iframe src="${page.url}" loading="lazy"></iframe>
        <div class="overlay"></div>
        <div class="label">${page.label}</div>
      `;
      el.addEventListener('click', () => { window.open(page.link, '_blank'); });

      const cssObject = new CSS3DObject(el);
      cssObject.position.set(x, 0, z);
      cssObject.lookAt(0, 0, 0);
      group.add(cssObject);
    });

    let targetRotation = 0;
    let currentRotation = 0;

    window.rotateLeft  = () => { targetRotation -= angleStep; };
    window.rotateRight = () => { targetRotation += angleStep; };

    // ⏱️ Défilement automatique toutes les 3 secondes
    const autoInterval = setInterval(() => {
      targetRotation += angleStep;
    }, 2500);

    // Pause auto quand l'utilisateur interagit manuellement
    function pauseAuto() {
      clearInterval(autoInterval);
      // Reprend après 8 secondes d'inactivité
      setTimeout(() => {
        clearInterval(autoInterval);
        autoIntervalRef = setInterval(() => {
          targetRotation += angleStep;
        }, 3000);
      }, 8000);
    }

    let autoIntervalRef = autoInterval;

    // On pause le défilement auto lors d'une interaction manuelle
    document.querySelectorAll('#controls button').forEach(btn => {
      btn.addEventListener('click', pauseAuto);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft')  { rotateLeft();  pauseAuto(); }
      if (e.key === 'ArrowRight') { rotateRight(); pauseAuto(); }
    });

    let touchStartX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      if (Math.abs(dx) > 50) {
        dx > 0 ? rotateLeft() : rotateRight();
        pauseAuto();
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      currentRotation += (targetRotation - currentRotation) * 0.08;
      group.rotation.y = currentRotation;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script></body>

   


</body>
</html>
