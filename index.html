     <title>Accueil - WikiMonkey © </title><style> .cadre-double {
      position: relative;

    .cadre-double img {
      display: block;
      position: relative;
      z-index: 2;
      width: 600px;
      height: auto;
    }

    .cadre-double::before {
      content: "";
      position: absolute;
      inset: 0;
      background-color: #3b82f6;
      transform: translate(14px, 14px);
      z-index: 0;
    }

    .cadre-double::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px solid #111827;
      transform: translate(-10px, -10px);
      z-index: 0;
    }

    .ma-div {
      overflow: hidden;
      white-space: nowrap;
      width: 100%;
    }

    .ma-div-inner {
      display: inline-flex;
      gap: 60px;
      animation: defilement 25s linear infinite;
    }

    @keyframes defilement {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }</style>
