      0%   { transform: translateY(0) rotate(0deg); }

    }

    @keyframes pop {
      0%   { transform: scale(0); opacity: 1; }
      70%  { transform: scale(1.2); opacity: 1; }

  <title>Singes qui tombent</title>
<div id="snow-container"></div>

<script>
  const emojis = ['🐒', '🐵', '🙈', '🙉', '🙊'];

  function creerSinge() {
    const container = document.getElementById('snow-container');
    const singe = document.createElement('div');
    singe.className = 'singe';
    singe.textContent = emojis[Math.floor(Math.random() * emojis.length)];

    singe.style.left = Math.random() * 100 + 'vw';
    singe.style.fontSize = (Math.random() * 25 + 15) + 'px';
    const duree = Math.random() * 5 + 3;
    singe.style.animationDuration = duree + 's';

    container.appendChild(singe);
    setTimeout(() => singe.remove(), duree * 1000);
  }

  setInterval(creerSinge, 300);

  // 🎯 GIF au clic
  document.body.addEventListener('click', function(event) {
    const img = document.createElement('img');
    img.src = 'SONION RING.webp'; // ← remplace par ton URL
    img.style.position = 'fixed';
    img.style.width = '150px';
    img.style.height = 'auto';
    img.style.pointerEvents = 'none';
    img.style.zIndex = '10000';
    img.style.left = (event.pageX - 75) + 'px';
    img.style.top  = (event.pageY - 75) + 'px';
    img.style.animation = 'pop 0.6s ease-out forwards';
    document.body.appendChild(img);

    setTimeout(() => img.remove(), 600);
  });
</script>
